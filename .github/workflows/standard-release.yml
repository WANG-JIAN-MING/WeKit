name: Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install project NDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep unzip
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android${MIN_SDK}-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && \
                -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wekit-keystore.jks"
            {
              echo "WEKIT_KEYSTORE_FILE=$RUNNER_TEMP/wekit-keystore.jks"
              echo "WEKIT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "WEKIT_KEY_ALIAS=$KEY_ALIAS"
              echo "WEKIT_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo 'Release signing secrets are incomplete; using the project build.gradle fallback.'
          fi

      - name: Build Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease

      - name: Verify Release APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            test -s "$apk"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
            if rg -q '^lib/(armeabi-v7a|x86|x86_64)/' "$RUNNER_TEMP/apk-entries.txt"; then
              echo "Forbidden ABI found in $apk" >&2
              exit 1
            fi
            rg -q '^lib/arm64-v8a/' "$RUNNER_TEMP/apk-entries.txt"
            sha256sum "$apk"
          done

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 30
